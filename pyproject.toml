[project]
name = "doptools"
requires-python = ">=3.9"
description = "A short description of your ML/Chemistry library"
dependencies = [
    "numpy>=2.4",
    "scikit-learn>=1.7",
    'pandas>=2.1', 
    'scipy>=1.7', 
    'matplotlib>=3.4', 
    'tqdm>=4.66.3',
    'ipython>=7.22', 
    'optuna>=3.5', 
    'timeout-decorator==0.5', 
    'xlwt>=1.3', 
    'xlrd>=2.0', 
    'openpyxl>=3.1', 
    'pillow>=11.2.1',
    "chython @ git+https://github.com/chython/chython.git@2.18?rev_type=tag"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[tool.pixi.dependencies]
rdkit = ">=2026.03"
py-xgboost = ">=3"
